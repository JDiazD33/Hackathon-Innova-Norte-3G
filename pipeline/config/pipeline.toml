# Parámetros del pipeline del Lote A: fuente, descarga, alcance y reglas de datos.
# Los parámetros de las señales (umbrales, ventanas y pesos) van en senales.toml.

# Versión de las reglas con que se generan los datos. Cambiarla cuando cambie una regla.
version_reglas = "2026.11.1"

[fuente]
nombre = "OECE – Contrataciones Abiertas (SEACE), vía OCP Data Registry"
url = "https://data.open-contracting.org/en/publication/135"
licencia = "CC BY 4.0"
atribucion = "Datos: OECE – Contrataciones Abiertas (SEACE), vía OCP Data Registry, licencia CC BY 4.0. Datos filtrados y transformados por el equipo para calcular señales de revisión."

[descarga]
# Solo se descarga desde estas direcciones, y solo se siguen redirecciones hacia ellas.
# Agregar una solo si es una fuente oficial y abierta (ver docs/datos/fuente-de-datos.md).
fuentes_permitidas = [
  "https://data.open-contracting.org/en/publication/135/download",
  "https://fastly.data.open-contracting.org/downloads/peru_oece_bulk",
]
url_plantilla = "https://data.open-contracting.org/en/publication/135/download?name={archivo}"
# Los archivos anuales agrupan los procesos por su última actualización: para tener
# completos los años de convocatoria hay que leer también los archivos posteriores.
archivos = ["2025.jsonl.gz", "2026.jsonl.gz"]

[alcance]
# Departamento del comprador (parties[id = buyer.id].address.department).
departamento = "LA LIBERTAD"
# Años de convocatoria (tender.datePublished).
anios = [2025, 2026]

[proveedores]
# Dos primeros dígitos del RUC. Ante la duda se trata como persona natural,
# para que su nombre nunca se muestre.
prefijos_ruc_persona_natural = ["10", "15", "16", "17"]
prefijos_ruc_persona_juridica = ["20"]
