# Parámetros de las señales del Lote A. Las reglas están en docs/datos/catalogo-de-senales.md.
# Cada señal tiene su versión: subirla cuando cambie su regla o sus parámetros.
# Una señal con activa = false necesita un motivo, que se informa en el manifiesto.

[comun]
# Valla superior de Tukey: Q3 + factor_tukey × RIC.
factor_tukey = 1.5
# Si un grupo de comparación regional tiene menos casos, se compara con el grupo nacional.
minimo_grupo = 30
# Procesos que no se evalúan, según tender.items[].statusDetails (todos sus ítems en ese estado).
estados_excluidos = ["CANCELADO"]

[prioridad]
cortes = { alta = 5, media = 3 }

[prioridad.pesos]
S01 = 3
S02 = 2
S03 = 3
S04 = 3
S06 = 2
S07 = 3
S08 = 3

# Métodos por nombre (tender.procurementMethodDetails). tender.procurementMethod no sirve:
# falta en los métodos de la Ley 32069. Un método que no está en ninguna lista queda sin
# clasificar y S01 no lo evalúa (se cuenta como exclusión).
[metodos]
competitivos = [
  "Licitación Pública",
  "Licitación Pública Abreviada",
  "Concurso Público",
  "Concurso Público Abreviado",
  "Concurso Público de Servicios",
  "Concurso Público para Consultoría",
  "Concurso Público para Evaluadores Expertos",
  "Adjudicación Simplificada",
  "Subasta Inversa Electrónica",
  "Comparación de Precios",
  "Selección de Consultores Individuales",
  "Procedimiento Especial de Contratación",
  "Proceso por Competencia",
  "Adjudicación para Contrato Marco",
]
no_competitivos = [
  "Contratación Directa",
]
# Métodos dudosos (decisión 9 de la parte 8): no se sabe si hubo competencia, así que quedan
# sin señal. S01 y S04 no los evalúan, y el manifiesto los nombra en metodos_sin_clasificar.
dudosos = [
  "Regímen Especial",
  "Convenio",
  "Contratación Internacional",
  "Adjudicación Abreviada",
  "Adjudicación Selectiva",
  "Contratos Estandarizados",
]

# Variantes que se comparan con su método base.
[metodos.variantes]
"Licitación Pública Abreviada Homologación" = "Licitación Pública Abreviada"
"Licitación Pública Abreviada - Ley N°26859" = "Licitación Pública Abreviada"
"Licitación Pública Abreviada - Ley N°31589" = "Licitación Pública Abreviada"
"Licitación Pública Abreviada Séptima DCF Ley N°32069" = "Licitación Pública Abreviada"
"Concurso Público Abreviado Homologación" = "Concurso Público Abreviado"
"Concurso Público Abreviado - Ley N°26859" = "Concurso Público Abreviado"
"Concurso Público Abreviado - Ley N°31589" = "Concurso Público Abreviado"
"Concurso Público Abreviado Séptima DCF Ley N°32069" = "Concurso Público Abreviado"
"Adjudicación Simplificada-Homologación" = "Adjudicación Simplificada"
"Adjudicación Simplificada - Séptima Disposición Complementaria Final Reg. Ley 30225" = "Adjudicación Simplificada"
"Procedimiento Especial de Contratación-Nueva Convocatoria por Desierto" = "Procedimiento Especial de Contratación"

[S01]
activa = true
version = 2
# "Un solo participante registrado" (decisión 1): la fuente no trae ofertas (bids) y
# numberOfTenderers cuenta a los participantes registrados.
unidad = "participantes registrados"
descripcion_umbral = "procedimiento competitivo con un solo participante registrado"
# Solo procesos con al menos una adjudicación (decisión 2): un proceso desierto no tiene
# contrato que revisar.
solo_con_adjudicacion = true

[S02]
activa = false
motivo = "La fuente no trae el plazo de presentación de ofertas: tender.tenderPeriod empieza y termina el día de la convocatoria."
version = 1
# El caso amerita revisión si su plazo, en días calendario, está bajo este percentil de su grupo.
percentil = 10
# Columnas de la tabla procesos con el inicio y el fin del plazo.
plazo_inicio = "fecha_inicio_presentacion"
plazo_fin = "fecha_fin_presentacion"

[S03]
activa = true
version = 2
# Ventana: los meses que terminan en la fecha de corte de los datos.
ventana_meses = 12
# Procesos que el proveedor debe haber ganado en la entidad, como mínimo.
minimo_adjudicaciones = 3
# Participación mínima, además de superar la valla (decisión 7): evita señales de 1 % a 3 %
# cuando casi todos los proveedores de la entidad ganan un solo proceso.
participacion_minima = 0.05

[S04]
activa = false
motivo = "Los umbrales están cargados, pero falta que el equipo los confirme y elija una calibración que dé un volumen que se pueda revisar."
version = 1
ventana_dias = 60
# Dígitos del código UNSPSC que definen "la misma clase de ítem" (6 = clase).
digitos_clasificacion = 6
# Umbral desde el que se exige el método superior, por método menos exigente, objeto y año.
# Salen del artículo 14 de las leyes de presupuesto 2025 (Ley 32185) y 2026 (Ley 32513).
# Comparación de Precios no tiene umbral en esas leyes, así que no se evalúa.
umbrales = [
  { metodo = "Adjudicación Simplificada", objeto = "obras", anio = 2025, umbral_pen = 5000000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.1, márgenes de la Ley 30225", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Adjudicación Simplificada", objeto = "bienes", anio = 2025, umbral_pen = 485000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.1, márgenes de la Ley 30225", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Adjudicación Simplificada", objeto = "servicios", anio = 2025, umbral_pen = 485000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.1, márgenes de la Ley 30225", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Licitación Pública Abreviada", objeto = "obras", anio = 2025, umbral_pen = 5000000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.2, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Licitación Pública Abreviada", objeto = "bienes", anio = 2025, umbral_pen = 485000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.2, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Concurso Público Abreviado", objeto = "servicios", anio = 2025, umbral_pen = 485000.0, norma = "Ley 32185 (presupuesto 2025), art. 14.2, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Licitación Pública Abreviada", objeto = "obras", anio = 2026, umbral_pen = 5000000.0, norma = "Ley 32513 (presupuesto 2026), art. 14, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Licitación Pública Abreviada", objeto = "bienes", anio = 2026, umbral_pen = 485000.0, norma = "Ley 32513 (presupuesto 2026), art. 14, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
  { metodo = "Concurso Público Abreviado", objeto = "servicios", anio = 2026, umbral_pen = 485000.0, norma = "Ley 32513 (presupuesto 2026), art. 14, márgenes de la Ley 32069", verificado = "2026-11-15, texto consolidado del Congreso; falta la confirmación del equipo" },
]

[S05]
activa = true
version = 2
# Métodos base de [metodos] que cuentan como contratación directa.
metodos_directos = ["Contratación Directa"]
# Una entidad con menos procesos no se evalúa ni entra en los grupos de comparación.
minimo_procesos = 10
# Con menos contrataciones directas no hay señal, aunque la proporción supere la valla.
minimo_directas = 3
# Proporción mínima, además de superar la valla (decisión 8): evita señales cuando casi todas
# las entidades del grupo valen cero y la valla queda cerca de cero.
proporcion_minima = 0.05

[S06]
activa = true
version = 1
factor = 1.15
# Si menos contratos tienen monto final, la señal se desactiva y el manifiesto lo informa.
cobertura_minima = 0.10

[S08]
activa = true
version = 1
# Expedientes internos SIMULADOS para el caso práctico (los datos abiertos no los traen).
cantidad_expedientes = 8
semilla = 20261113
# ocids elegidos para el caso práctico; si la lista está vacía, se eligen con la semilla
# entre los procesos con contrato.
procesos = []
