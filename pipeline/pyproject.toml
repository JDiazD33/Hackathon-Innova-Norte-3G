[project]
name = "pipeline"
version = "0.1.0"
description = "Convierte los datos abiertos de contrataciones del Perú (OCDS) en señales de revisión."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "ocdscardinal>=0.0.9",
]

[project.scripts]
pipeline = "pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
